# Conservative CPU defaults for a laptop. A remote GPU worker can mount its
# own config without changing the website or analysis job contract.
numSearchThreadsPerAnalysisThread = 2
numAnalysisThreads = 1
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 16
reportAnalysisWinratesAs = SIDETOMOVE
analysisPVLen = 12
logSearchInfo = false
logToStderr = true
