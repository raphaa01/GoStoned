name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 22.x

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Responsive browser tests
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: warn
          name: responsive-browser-failures
          path: test-results/
          retention-days: 5

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_NAME: GoStone
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3101
      BASE_URL: http://127.0.0.1:3101
      APP_URL: http://127.0.0.1:3101
      DATABASE_POOL_MAX: "5"
      GOSTONE_CI_DATABASE_BOOTSTRAP: gostone-ci-v1
      GOSTONE_SMOKE_DATABASE_NAME: gostone_ci
      GOSTONE_SMOKE_DATABASE_ROLE: gostone_ci_runner
      DATABASE_URL: postgresql://gostone_ci_admin:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}@127.0.0.1:5432/gostone_ci
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: gostone_ci_admin
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          POSTGRES_DB: gostone_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gostone_ci_admin -d gostone_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 22.x

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare isolated PostgreSQL owner and client roles
        run: npm run db:prepare-ci-smoke

      - name: Verify fresh and idempotent migration chain
        run: npm run test:migrations-db

      - name: Run direct PostgreSQL concurrency smokes
        run: |
          npm run test:matchmaking-races
          npm run test:player-report-races
          npm run test:move-hash-db
          npm run test:rate-limit

      - name: Build production application
        run: npm run build

      - name: Verify production-server cleanup fault paths
        shell: bash
        run: |
          set -Eeuo pipefail

          run_expected_fault() {
            local fault=$1
            local expected_status=$2
            local observed_status=0

            if GOSTONE_CI_SERVER_FAULT="$fault" \
              bash scripts/run-ci-production-smokes.sh; then
              echo "::error::Expected server harness fault '$fault' did not fail."
              exit 1
            else
              observed_status=$?
            fi
            if (( observed_status != expected_status )); then
              echo "::error::Server harness fault '$fault' exited with $observed_status, expected $expected_status."
              exit 1
            fi
          }

          run_expected_fault after-pid-publication 97
          run_expected_fault supervisor-loss 98
          run_expected_fault validated-supervisor-loss 99

      - name: Run production-server PostgreSQL smokes
        shell: bash
        run: bash scripts/run-ci-production-smokes.sh

      - name: Reverify migration and concurrent-index state
        run: npm run test:migrations-db -- --verify-only

      - name: Print PostgreSQL logs on failure
        if: failure()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: docker logs "$POSTGRES_CONTAINER_ID" 2>&1 || true
