services:
  postgres:
    image: postgres:16
    container_name: gostoned_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gostoned
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gostoned"]
      interval: 5s
      timeout: 5s
      retries: 10

  katago:
    build:
      context: .
      dockerfile: docker/katago/Dockerfile
    container_name: gostone_katago
    restart: unless-stopped
    environment:
      DATABASE_URL: ${KATAGO_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/gostoned}
      DATABASE_SSL: ${KATAGO_DATABASE_SSL:-disable}
      DATABASE_POOL_MAX: ${KATAGO_DATABASE_POOL_MAX:-2}
      KATAGO_MAX_VISITS: ${KATAGO_MAX_VISITS:-20}
      KATAGO_POLL_INTERVAL_MS: "2000"
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
